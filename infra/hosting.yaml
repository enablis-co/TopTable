AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  TT-41 — Top Table hosting: hosted zone, certificate, bucket, distribution,
  IAM roles and alias record for toptable.enablis.tech.

# Two things a future edit must not undo:
#
# 1. The hosted zone is retained on delete AND on a replacing update. Its nameservers
#    are what the `toptable` delegation in the root account points at. Deleting this
#    stack and re-applying it creates a SECOND zone with different nameservers — the
#    old zone is still retained but now holds no alias record, and the delegation
#    points at nothing. Recovering that zone means an IMPORT changeset
#    (`create-change-set --change-set-type IMPORT`), never a plain create. See
#    infra/README.md.
# 2. The distribution's origin is the S3 WEBSITE endpoint on purpose, not the REST
#    endpoint. The REST endpoint (Bucket.DomainName / Bucket.RegionalDomainName) looks
#    like the "proper" choice and breaks every pull request preview rather than the
#    live site, so it passes a casual test. KB-7 has why.

Parameters:
  DomainName:
    Type: String
    Description: The apex domain this stack serves, e.g. toptable.enablis.tech.

  BucketName:
    Type: String
    Default: toptable-site
    Description: The S3 bucket name. Global, so it must be available before applying.

  GitHubRepository:
    Type: String
    Default: enablis-co/TopTable
    Description: owner/repo, used to scope the OIDC trust condition.

Resources:
  HostedZone:
    Type: AWS::Route53::HostedZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref DomainName

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZone

  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      WebsiteConfiguration:
        IndexDocument: index.html
        # No ErrorDocument: there is no client-side router and no 404 to rescue.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Public read is deliberate (KB-7): the bucket holds a public static site and
          # nothing else, so this is the correct amount of private.
          - Sid: PublicReadForWebsite
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${Bucket.Arn}/*'

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        DefaultRootObject: index.html
        Aliases:
          - !Ref DomainName
        Origins:
          - Id: website
            # Bucket.WebsiteURL is http://<bucket>.s3-website-us-east-1.amazonaws.com — the
            # website endpoint. Split/Select strips the scheme, which CustomOriginConfig's
            # DomainName must not carry. Do NOT swap this for Bucket.DomainName or
            # Bucket.RegionalDomainName (the REST endpoint) — see the header comment.
            DomainName: !Select [1, !Split ['//', !GetAtt Bucket.WebsiteURL]]
            CustomOriginConfig:
              # Website endpoints are HTTP-only; match-viewer would break every HTTPS request.
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: website
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # AWS managed "CachingOptimized" policy. Honours the origin's own Cache-Control,
          # which is what lets TT-42 split cache headers between hashed assets and index.html.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Deliberately no OriginRequestPolicyId. The default forwards no Host header; the
          # website endpoint answers only to its own hostname, so forwarding Host (e.g. the
          # AllViewer managed policy) turns every request into a 404 against S3.
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  AliasRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZone
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            # The fixed, global hosted-zone id for CloudFront alias targets — not this
            # zone's id.
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

  PublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: toptable-publish
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              # Constructed, never created: the OIDC provider already exists in this
              # account. An AWS::IAM::OIDCProvider resource here fails the first apply
              # with EntityAlreadyExists.
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Not narrowed to main: TT-43 assumes this role from pull request branches.
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:*'
      Policies:
        - PolicyName: publish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${Bucket.Arn}/*'
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  InfraRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: toptable-infra
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:*'
      Policies:
        - PolicyName: infra
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:*
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/toptable-hosting/*'
              - Effect: Allow
                # Describe/List/Validate take no resource — they cannot be scoped further.
                Action:
                  - cloudformation:Describe*
                  - cloudformation:List*
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Effect: Allow
                Action: s3:*
                Resource:
                  - !GetAtt Bucket.Arn
                  - !Sub '${Bucket.Arn}/*'
              - Effect: Allow
                # CreateBucket and the ListAllMyBuckets preflight take no resource.
                Action:
                  - s3:CreateBucket
                  - s3:ListAllMyBuckets
                Resource: '*'
              - Effect: Allow
                # IAM writes, scoped to this stack's own roles only.
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/toptable-*'
              - Effect: Allow
                # Not resource-scopable for creation (CloudFront, ACM and Route 53 do not
                # support resource-level permissions on the create/request actions this
                # role needs). The boundary here is the trust policy and the gated
                # infra-apply environment, not the resource ARN.
                Action:
                  - cloudfront:*
                  - acm:*
                  - route53:*
                Resource: '*'
      # No iam:PassRole: nothing in this stack passes a role to a service.

Outputs:
  BucketName:
    Value: !Ref Bucket

  DistributionId:
    Value: !Ref Distribution

  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName

  PublishRoleArn:
    Value: !GetAtt PublishRole.Arn

  InfraRoleArn:
    Value: !GetAtt InfraRole.Arn

  SiteUrl:
    Value: !Sub 'https://${DomainName}/'

  HostedZoneId:
    Value: !Ref HostedZone

  NameServers:
    Value: !Join [',', !GetAtt HostedZone.NameServers]
